<!DOCTYPE html>
<html lang="en">

<head>

    <!-- Basic Meta -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Website Title -->
    <title>Spectra Guard</title>

    <!-- Google Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Audiowide&family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- CSS -->
    <link rel="stylesheet" href="assets/css/variables.css">
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="stylesheet" href="assets/css/animations.css">

</head>

<body>

    <!-- =========================
         Navigation
    ========================== -->

    <header>

        <div class="logo">

            SPECTRA GUARD

        </div>

    </header>



    <!-- =========================
         Hero Section
    ========================== -->

    <main>

        <section class="hero">

            <h1>
                Know what websites may learn about you.
            </h1>

            <p>
                Analyze cookies, trackers, permissions and privacy signals
                before you trust a website.
            </p>

            <div class="scan-box">

                <input
                    type="url"
                    placeholder="https://example.com">

                <button id="analyzeBtn">

                    Analyze

                </button>

            </div>

        </section>
<!-- =========================
     Results
========================= -->

<section id="results" class="results hidden">

    <div class="score-card">

        <h2>Privacy Score</h2>

        <div class="score">

            82<span>/100</span>

        </div>

    </div>


    <div class="info-grid">

        <div class="info-card">
            <h3>Cookies</h3>
            <p>12 Detected</p>
        </div>

        <div class="info-card">
            <h3>Trackers</h3>
            <p>3 Found</p>
        </div>

        <div class="info-card">
            <h3>HTTPS</h3>
            <p>Secure</p>
        </div>

        <div class="info-card">
            <h3>Permissions</h3>
            <p>Safe</p>
        </div>

    </div>

</section>
    </main>



    <!-- JavaScript -->
    <script src="assets/js/scanner.js"></script>
    <script src="assets/js/ui.js"></script>
    <script src="assets/js/app.js"></script>

</body>

</html>
