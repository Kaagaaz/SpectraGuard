<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Spectra Guard Report</title>


<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Audiowide&family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">


<link rel="stylesheet" href="assets/css/variables.css">
<link rel="stylesheet" href="assets/css/style.css">
<link rel="stylesheet" href="assets/css/animations.css">


</head>


<body>



<header>

<div class="logo">
SPECTRA GUARD
</div>

</header>





<main class="report-page">



<section class="report-header">


<h1>
Security Report
</h1>


<p id="websiteName">
Analyzing website...
</p>


</section>









<section class="score-card">


<h2>
Security Score
</h2>



<div class="score-circle">


<div class="score-value">

<span id="score">
0
</span>

<small>
/100
</small>

</div>


</div>



<h3 id="risk">
Checking risk...
</h3>



</section>









<section class="info-grid">



<div class="info-card">

<div class="status">
🔒 HTTPS
</div>


<h3>
Connection
</h3>


<p id="https">
Checking...
</p>


</div>







<div class="info-card">


<div class="status">
🍪 Cookies
</div>


<h3>
Cookies
</h3>


<p id="cookies">
Checking...
</p>


</div>







<div class="info-card">


<div class="status">
📡 Trackers
</div>


<h3>
Trackers
</h3>


<p id="trackers">
Checking...
</p>


</div>






</section>









<section class="report-box">


<h2>
Detected Issues
</h2>


<div id="issues">

Loading...

</div>


</section>









<section class="report-box">


<h2>
Vulnerabilities
</h2>


<div id="vulnerabilities">

Loading...

</div>


</section>









<section class="report-box">


<h2>
Recommendations
</h2>


<ul id="recommendations">

<li>
Loading...
</li>

</ul>


</section>









<button 
onclick="window.location.href='index.html'"
class="back-btn">

Scan Another Website

</button>






</main>





<script src="assets/js/report.js"></script>


</body>

</html>
